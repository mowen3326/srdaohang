<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/">
      <span class="brand-logo{{ if .Logo }} has-img{{ end }}" aria-hidden="true">
        {{ if and .LogoLight .LogoDark }}
          {{ if eq .LogoLight .LogoDark }}
            <img src="/uploads/{{ .LogoLight }}" alt="" class="brand-logo-img">
          {{ else }}
            <img src="/uploads/{{ .LogoLight }}" alt="" class="brand-logo-img logo-light">
            <img src="/uploads/{{ .LogoDark }}" alt="" class="brand-logo-img logo-dark">
          {{ end }}
        {{ else }}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3.2 2"></path>
          </svg>
        {{ end }}
      </span>
    </a>

    <span class="brand-text">{{ .SiteName }}</span>

    <div class="header-actions">
      <div class="search-box" id="search-box" hidden>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input type="search" id="search" placeholder="搜索网址…" autocomplete="off" aria-label="搜索网址">
      </div>

      <button class="icon-btn" id="search-btn" title="搜索" aria-label="搜索" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
        </svg>
      </button>

      <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
